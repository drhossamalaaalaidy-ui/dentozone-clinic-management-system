        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceCorrectionInput"
      responses:
        "200":
          description: Invoice DTO including append-only correction history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          description: Invalid invoice id or reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Role is not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already voided or invoice has active payments / nonzero paid balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: voidInvoice
      security:
        - staffSession: []
  /finance/payments/{paymentId}/void:
    post:
      summary: Reverse a payment without deleting or editing it
      description: >
        Owner, manager, or accountant only. Locks the invoice row and reverses the exact payment
        amount from invoice and associated installment balances in one transaction. The payment row
        remains unchanged; the reason and immutable before/after payment, invoice, and installment
        snapshots are written to the clinic audit log. Repeated reversals conflict. Reversed payments
        are omitted from finance revenue reports and remain visible in invoice correction history.
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceCorrectionInput"
      responses:
        "200":
          description: Invoice DTO including append-only correction history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          description: Invalid payment id or reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Role is not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already reversed or inconsistent balances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: reversePayment
      security:
        - staffSession: []
