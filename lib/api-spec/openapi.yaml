openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DentOzone clinic operations API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: clinic
  - name: dashboard
  - name: patients
  - name: staff
  - name: audit
  - name: finance
  - name: inventory
  - name: appointments
  - name: clinical
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /session:
    get:
      operationId: getSession
      tags: [staff]
      summary: Resolve the signed-in clinic staff member
      responses:
        "200":
          description: Signed-in staff identity and clinic role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffSession"
        "401":
          description: Sign-in required
        "403":
          description: Account is not authorized for this clinic
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get current clinic activity and financial totals
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /patients:
    get:
      operationId: getPatients
      tags: [patients]
      summary: Search and list clinic patients
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Patient records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Patient"
    post:
      operationId: createPatient
      tags: [patients]
      summary: Register a patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientInput"
      responses:
        "201":
          description: Registered patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
  /patients/{patientId}:
    parameters:
      - in: path
        name: patientId
        required: true
        schema: { type: integer }
    get:
      operationId: getPatient
      tags: [patients]
      summary: Get a patient profile
      responses:
        "200":
          description: Patient profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "404":
          description: Patient not found
    patch:
      operationId: updatePatient
      tags: [patients]
      summary: Update patient details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientUpdate"
      responses:
        "200":
          description: Updated patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
  /clinic-settings:
    get:
      operationId: getClinicSettings
      tags: [clinic]
      summary: Get clinic settings
      responses:
        "200":
          description: Clinic settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicSettings"
    patch:
      operationId: updateClinicSettings
      tags: [clinic]
      summary: Update clinic settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClinicSettingsUpdate"
      responses:
        "200":
          description: Updated clinic settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicSettings"
  /staff:
    get:
      operationId: getStaff
      tags: [staff]
      summary: List clinic staff
      responses:
        "200":
          description: Staff members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
    post:
      operationId: inviteStaff
      tags: [staff]
      summary: Invite a staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffInviteInput"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
  /staff/{staffId}:
    parameters:
      - in: path
        name: staffId
        required: true
        schema: { type: integer }
    patch:
      operationId: updateStaff
      tags: [staff]
      summary: Change a staff member's role or status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffUpdate"
      responses:
        "200":
          description: Updated staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
  /audit-log:
    get:
      operationId: getAuditLog
      tags: [audit]
      summary: List recent clinic audit events
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Recent audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
  /finance/invoices:
    get:
      operationId: listInvoices
      tags: [finance]
      summary: List patient invoices
      parameters:
        - in: query
          name: patientId
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Patient invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
    post:
      operationId: createInvoice
      tags: [finance]
      summary: Create a patient invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
      responses:
        "201":
          description: Created invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
  /finance/patients:
    get:
      operationId: searchBillingPatients
      tags: [finance]
      summary: Find a patient by name or code for billing without exposing clinical records
      parameters:
        - in: query
          name: search
          required: true
          schema: { type: string, minLength: 2, maxLength: 80 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Matching patient identities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BillingPatient"
  /finance/invoices/{invoiceId}:
    parameters:
      - in: path
        name: invoiceId
        required: true
        schema: { type: integer }
    get:
      operationId: getInvoice
      tags: [finance]
      summary: Get an invoice
      responses:
        "200":
          description: Invoice details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
  /finance/invoices/{invoiceId}/payments:
    parameters:
      - in: path
        name: invoiceId
        required: true
        schema: { type: integer }
    post:
      operationId: recordPayment
      tags: [finance]
      summary: Record a payment against an invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Recorded payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancePayment"
  /finance/expenses:
    get:
      operationId: listExpenses
      tags: [finance]
      summary: List clinic expenses
      responses:
        "200":
          description: Clinic expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
    post:
      operationId: createExpense
      tags: [finance]
      summary: Record a clinic expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Recorded expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
  /finance/expenses/{expenseId}:
    parameters:
      - in: path
        name: expenseId
        required: true
        schema: { type: integer }
    patch:
      operationId: updateExpense
      tags: [finance]
      summary: Update a clinic expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseUpdate"
      responses:
        "200":
          description: Updated expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
  /finance/suppliers:
    get:
      operationId: listSuppliers
      tags: [finance]
      summary: List clinic suppliers
      responses:
        "200":
          description: Clinic suppliers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supplier"
    post:
      operationId: createSupplier
      tags: [finance]
      summary: Create a supplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierInput"
      responses:
        "201":
          description: Created supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
  /finance/suppliers/{supplierId}:
    parameters:
      - in: path
        name: supplierId
        required: true
        schema: { type: integer }
    patch:
      operationId: updateSupplier
      tags: [finance]
      summary: Update a supplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierUpdate"
      responses:
        "200":
          description: Updated supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
  /finance/report:
    get:
      operationId: getFinanceReport
      tags: [finance]
      summary: Get a finance report for a date range
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Finance report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceReport"
  /inventory:
    get:
      operationId: listInventoryItems
      tags: [inventory]
      summary: List inventory items
      responses:
        "200":
          description: Inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"
    post:
      operationId: createInventoryItem
      tags: [inventory]
      summary: Create an inventory item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemInput"
      responses:
        "201":
          description: Created inventory item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
  /inventory/{itemId}:
    parameters:
      - in: path
        name: itemId
        required: true
        schema: { type: integer }
    patch:
      operationId: updateInventoryItem
      tags: [inventory]
      summary: Update inventory item details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemUpdate"
      responses:
        "200":
          description: Updated inventory item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
  /inventory/{itemId}/movements:
    parameters:
      - in: path
        name: itemId
        required: true
        schema: { type: integer }
    get:
      operationId: listStockMovements
      tags: [inventory]
      summary: List inventory stock movements
      responses:
        "200":
          description: Stock movements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockMovement"
    post:
      operationId: recordStockMovement
      tags: [inventory]
      summary: Record an inventory stock movement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockMovementInput"
      responses:
        "201":
          description: Recorded stock movement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovement"
  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: List appointments in a time range
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: doctorStaffId
          schema: { type: integer }
        - in: query
          name: chair
          schema: { type: string }
      responses:
        "200":
          description: Appointments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Appointment" }
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Schedule an appointment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentInput" }
      responses:
        "201":
          description: Scheduled appointment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
  /appointments/doctors:
    get:
      operationId: listAppointmentDoctors
      tags: [appointments]
      summary: List doctors available for appointments
      responses:
        "200":
          description: Appointment doctors
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AppointmentDoctor" }
  /appointments/{appointmentId}:
    parameters:
      - in: path
        name: appointmentId
        required: true
        schema: { type: integer }
    get:
      operationId: getAppointment
      tags: [appointments]
      summary: Get an appointment
      responses:
        "200":
          description: Appointment details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
    patch:
      operationId: updateAppointment
      tags: [appointments]
      summary: Update an appointment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentUpdate" }
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
  /appointments/{appointmentId}/cancel:
    parameters:
      - in: path
        name: appointmentId
        required: true
        schema: { type: integer }
    post:
      operationId: cancelAppointment
      tags: [appointments]
      summary: Cancel an appointment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentCancelInput" }
      responses:
        "200":
          description: Cancelled appointment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
  /patients/{patientId}/visits:
    parameters:
      - in: path
        name: patientId
        required: true
        schema: { type: integer }
    get:
      operationId: listPatientVisits
      tags: [clinical]
      summary: List a patient's visits
      responses:
        "200":
          description: Patient visits
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Visit" }
    post:
      operationId: createPatientVisit
      tags: [clinical]
      summary: Record a patient visit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VisitInput" }
      responses:
        "201":
          description: Recorded visit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Visit" }
  /visits/{visitId}:
    parameters:
      - in: path
        name: visitId
        required: true
        schema: { type: integer }
    get:
      operationId: getVisit
      tags: [clinical]
      summary: Get a visit
      responses:
        "200":
          description: Visit details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Visit" }
    patch:
      operationId: updateVisit
      tags: [clinical]
      summary: Update a visit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VisitUpdate" }
      responses:
        "200":
          description: Updated visit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Visit" }
  /visits/{visitId}/diagnoses:
    parameters:
      - in: path
        name: visitId
        required: true
        schema: { type: integer }
    post:
      operationId: addVisitDiagnosis
      tags: [clinical]
      summary: Record a diagnosis for a visit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiagnosisInput" }
      responses:
        "201":
          description: Recorded diagnosis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Diagnosis" }
  /visits/{visitId}/procedures:
    parameters:
      - in: path
        name: visitId
        required: true
        schema: { type: integer }
    post:
      operationId: addVisitProcedure
      tags: [clinical]
      summary: Record a procedure for a visit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProcedureInput" }
      responses:
        "201":
          description: Recorded procedure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Procedure" }
  /patients/{patientId}/odontogram:
    parameters:
      - in: path
        name: patientId
        required: true
        schema: { type: integer }
    get:
      operationId: listPatientOdontogram
      tags: [clinical]
      summary: Get a patient's odontogram findings
      responses:
        "200":
          description: Tooth findings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ToothFinding" }
    post:
      operationId: createToothFinding
      tags: [clinical]
      summary: Record a tooth finding
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ToothFindingInput" }
      responses:
        "201":
          description: Recorded tooth finding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToothFinding" }
  /patients/{patientId}/treatment-plans:
    parameters:
      - in: path
        name: patientId
        required: true
        schema: { type: integer }
    get:
      operationId: listPatientTreatmentPlans
      tags: [clinical]
      summary: List a patient's treatment plans
      responses:
        "200":
          description: Patient treatment plans
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TreatmentPlan" }
    post:
      operationId: createTreatmentPlan
      tags: [clinical]
      summary: Create a treatment plan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TreatmentPlanInput" }
      responses:
        "201":
          description: Created treatment plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreatmentPlan" }
  /treatment-plans/{planId}:
    parameters:
      - in: path
        name: planId
        required: true
        schema: { type: integer }
    get:
      operationId: getTreatmentPlan
      tags: [clinical]
      summary: Get a treatment plan
      responses:
        "200":
          description: Treatment plan details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreatmentPlan" }
    patch:
      operationId: updateTreatmentPlan
      tags: [clinical]
      summary: Update a treatment plan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TreatmentPlanUpdate" }
      responses:
        "200":
          description: Updated treatment plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreatmentPlan" }
  /treatment-plans/{planId}/items:
    parameters:
      - in: path
        name: planId
        required: true
        schema: { type: integer }
    post:
      operationId: addTreatmentPlanItem
      tags: [clinical]
      summary: Add an item to a treatment plan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TreatmentPlanItemInput" }
      responses:
        "201":
          description: Added treatment plan item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreatmentPlanItem" }
  /treatment-plans/{planId}/items/{itemId}:
    parameters:
      - in: path
        name: planId
        required: true
        schema: { type: integer }
      - in: path
        name: itemId
        required: true
        schema: { type: integer }
    patch:
      operationId: updateTreatmentPlanItem
      tags: [clinical]
      summary: Update a treatment plan item
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TreatmentPlanItemUpdate" }
      responses:
        "200":
          description: Updated treatment plan item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreatmentPlanItem" }
  /patients/{patientId}/documents:
    parameters:
      - in: path
        name: patientId
        required: true
        schema: { type: integer }
    get:
      operationId: listPatientDocuments
      tags: [patients]
      summary: List a patient's document metadata
      responses:
        "200":
          description: Patient documents; file bytes are stored in private object storage
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PatientDocument" }
  /patients/{patientId}/documents/upload-request:
    parameters:
      - in: path
        name: patientId
        required: true
        schema: { type: integer }
    post:
      operationId: requestPatientDocumentUpload
      tags: [patients]
      summary: Request a presigned upload URL for a patient document
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentUploadInput" }
      responses:
        "201":
          description: Presigned upload URL and pending document metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentUploadTicket" }
  /patients/{patientId}/documents/{documentId}/complete:
    parameters:
      - in: path
        name: patientId
        required: true
        schema: { type: integer }
      - in: path
        name: documentId
        required: true
        schema: { type: integer }
    post:
      operationId: completePatientDocumentUpload
      tags: [patients]
      summary: Verify uploaded bytes and activate a patient document
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentCompleteInput" }
      responses:
        "200":
          description: Verified and activated document metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatientDocument" }
  /patients/{patientId}/documents/{documentId}/file:
    parameters:
      - in: path
        name: patientId
        required: true
        schema: { type: integer }
      - in: path
        name: documentId
        required: true
        schema: { type: integer }
    get:
      operationId: downloadPatientDocument
      tags: [patients]
      summary: Download a patient document by authenticated document ID
      description: Requires patient-document authorization; returns bytes from private object storage, never from the database.
      responses:
        "200":
          description: Authenticated document bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "403":
          description: Not authorized to access this document
        "404":
          description: Document not found or unavailable
  /patients/{patientId}/documents/{documentId}:
    parameters:
      - in: path
        name: patientId
        required: true
        schema: { type: integer }
      - in: path
        name: documentId
        required: true
        schema: { type: integer }
    patch:
      operationId: updatePatientDocumentStatus
