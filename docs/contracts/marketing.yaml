openapi: 3.1.0
info:
  title: DentOzone Marketing and Referral Reporting
  version: 1.0.0
  description: Owner/manager campaign administration and privacy-safe aggregated referral reporting.
servers:
  - url: /api
security:
  - staffSession: []
paths:
  /clinic/marketing/campaigns:
    get:
      summary: List marketing campaigns
      description: Owner and manager only.
      responses:
        "200":
          description: Campaign records; no patient-level data.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
      operationId: listMarketingCampaigns
      security:
        - staffSession: []
    post:
      summary: Create a campaign
      description: Code is the referral-source identifier. Its normalized value is unique.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Created campaign.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A campaign with the normalized code already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: createMarketingCampaign
      security:
        - staffSession: []
  /clinic/marketing/campaigns/{campaignId}:
    patch:
      summary: Update a campaign
      description: Owner and manager only. Changes are audited.
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignPatch"
      responses:
        "200":
          description: Updated campaign.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Campaign not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: updateMarketingCampaign
      security:
        - staffSession: []
  /clinic/marketing/campaigns/{campaignId}/disable:
    post:
      summary: Disable a campaign
      description: Soft-disables the campaign and preserves its history. Owner and manager only; action is
        audited.
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      responses:
        "200":
          description: Disabled campaign.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Campaign not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: disableMarketingCampaign
      security:
        - staffSession: []
  /clinic/marketing/report:
    get:
      summary: Get aggregate referral reporting
      description: Counts normalized patient referralSource values by campaign code and unmatched source.
        Never returns patient identifiers or row-level data.
      parameters:
        - name: from
          in: query
          required: false
          description: Inclusive patient registration date in the clinic timezone. Must be paired with to.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Inclusive patient registration date in the clinic timezone. Must be paired with from.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Aggregate-only report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
      operationId: getMarketingReport
      security:
        - staffSession: []
components:
  parameters:
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Role is not authorized; only clinic owners and managers can use these endpoints.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    CampaignInput:
      type: object
      additionalProperties: false
      required:
        - code
        - channel
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 120
          description: Campaign code or source identifier matched against normalized referralSource.
        channel:
          type: string
          minLength: 1
          maxLength: 80
        startDate:
          type:
            - string
            - "null"
          format: date
        endDate:
          type:
            - string
            - "null"
          format: date
        status:
          type: string
          enum:
            - active
            - paused
            - ended
    CampaignPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Supply one or more campaign fields. Disabled status is set only through the disable
        operation.
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 120
        channel:
          type: string
          minLength: 1
          maxLength: 80
        startDate:
          type:
            - string
            - "null"
          format: date
        endDate:
          type:
            - string
            - "null"
          format: date
        status:
          type: string
          enum:
            - active
            - paused
            - ended
    Campaign:
      type: object
      required:
        - id
        - code
        - channel
        - startDate
        - endDate
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        code:
          type: string
        channel:
          type: string
        startDate:
          type:
            - string
            - "null"
          format: date
        endDate:
          type:
            - string
            - "null"
          format: date
        status:
          type: string
          enum:
            - active
            - paused
            - ended
            - disabled
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MarketingReport:
      type: object
      required:
        - campaigns
        - unattributedSources
        - totalReferrals
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        campaigns:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Campaign"
              - type: object
                required:
                  - referrals
                properties:
                  referrals:
                    type: integer
                    minimum: 0
        unattributedSources:
          type: array
          items:
            type: object
            required:
              - source
              - referrals
            properties:
              source:
                type: string
                description: Uppercase trimmed referral-source label, not a patient identifier.
              referrals:
                type: integer
                minimum: 0
        totalReferrals:
          type: integer
          minimum: 0
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
  securitySchemes:
    staffSession:
      type: http
      scheme: bearer
      bearerFormat: DentOzone staff session
